<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>b4Play — Video summary</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="panel">
    <main aria-labelledby="app-name">
      <header>
        <strong id="app-name">b4Play</strong>
        <small>0.1.1 · ALPHA</small>
      </header>

      <section aria-labelledby="title">
        <h1 id="title" data-text="intro">Context before your next play.</h1>
        <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
        <p id="disclosure" class="disclosure" data-text="disclosure" hidden></p>

        <button id="summarize" type="button" data-text="summarize" aria-controls="summary" disabled>
          Summarize current video
        </button>

        <p id="summary" aria-live="polite" aria-atomic="true" aria-busy="false"></p>
        <button id="copy" type="button" data-text="copy" hidden>Copy summary</button>
      </section>

      <footer>
        <a id="settings" class="secondary" href="settings.html" target="_blank" rel="noopener noreferrer" data-text="settings">Settings</a>
      </footer>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
